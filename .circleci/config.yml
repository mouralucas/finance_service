# This config was automatically generated from your source code
# Stacks detected: deps:python:.
version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.12


orbs:
  python: circleci/python@2


jobs:
  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Configurar chave SSH
          command: |
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H $DEPLOY_SERVER_HOST >> ~/.ssh/known_hosts
      - run:
          name: Desbloquear chave com senha
          command: |
            eval "$(ssh-agent -s)"
            echo "$SSH_PASSPHRASE" | ssh-add ~/.ssh/id_rsa
      - run:
          name: Deploy para o servidor
          command: |
            ssh $DEPLOY_USER@$DEPLOY_SERVER_HOST <<EOF
              cd /var/www/service/finance
              # Aqui você pode rodar os comandos para o deploy
              echo "Fazendo deploy..."
              docker-compose down
              git pull origin main
              # Qualquer outro comando necessário
            EOF

  test-service:
    executor: python-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-python-packages-{{ checksum "requirements.txt" }}
            - v1-python-packages-
      - python/install-packages:
          pkg-manager: pip
      - save_cache:
          paths:
            - ~/.cache/pip
          key: v1-python-packages-{{ checksum "requirements.txt" }}
      - run:
          name: Run library tests
          command: pytest --junitxml=junit.xml || ((($? == 5)) && echo 'Did not find any tests to run.')
      - store_test_results:
          path: junit.xml

workflows:
  build-and-test:
    jobs:
      - test-service:
          filters:
            branches:
              only:
                - develop