version: "3.9"

services:
  backend-finance-service:
    image: mouralucas/rolf-services:finance
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - finance_database_url=${finance_database_url}
      - auth_service_base_url=${auth_service_base_url}
    ports:
      - "8003:8000"

  nginx:
    image: nginx
    restart: unless-stopped
    depends_on:
      - backend-finance-service
    ports:
      - "9003:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - server_host=${server_host}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  pg_finance_service:
    container_name: pg_finance_service
    image: postgres:15-alpine
    platform: linux/amd64
    restart: always
    environment:
      POSTGRES_USER: dev-user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance_dev_db
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data:cached

volumes:
  db-data:
