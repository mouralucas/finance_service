[tool.ruff]
src = ["."]
line-length = 150
target-version = "py311"

exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "alembic",
]

[tool.ruff.lint]
select = [
    "F",    # pyflakes (erros básicos)
    "E",    # pycodestyle (estilo)
    "W",    # pycodestyle warnings
    "I",    # isort (ordem de imports)
    "N",    # pep8-naming (nomes de funções/variáveis/classes)
    "UP",   # pyupgrade (modernização de sintaxe)
    "C90",  # mccabe (complexidade)
]

ignore = []
