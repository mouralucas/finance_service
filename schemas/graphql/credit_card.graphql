extend type Query {
    getCreditCards(params: GetCreditCardsInput): GetCreditCardsResponse
    getCreditCardTransactions(params: GetCreditCardTransactionsInput): GetCreditCardTransactionsResponse
    getCreditCardTransactionById(id: Int!): Int
    getCreditCardInstallmentDueDates(params: GetInstallmentsDueDatesInput): GetInstallmentsDueDatesResponse
}

extend type Mutation {
    createCreditCardTransaction(transaction: CreateCreditCardTransactionInput!): CreateCreditCardTransactionResponse!
}

# Get credit cards
input GetCreditCardsInput {
    id: String
    active: Boolean
}

type GetCreditCardsResponse {
    quantity: Int!
    creditCards: [CreditCard]!
}

type CreditCard {
    creditCardId: String!
    active: Boolean!
    ownerId: String!
    nickname: String!
    accountId: String
    currencyId: String!
    issueDate: Date
    cancellationDate: String
    dueDay: Int
    closeDay: Int
}

# Credit card transactions
input GetCreditCardTransactionsInput {
    creditCardId: String
    startPeriod: Int
    endPeriod: Int
    parentId: Int
}

type GetCreditCardTransactionsResponse {
    quantity: Int!
    transactions: [CreditCardTransaction]!
}

type GetCreditCardTransactionByIdResponse {
    transaction: CreditCardTransaction
}

type CreditCardTransaction {
    id: String!
    ownerId: String!
    creditCardId: String!
    creditCardNickname: String
    period: Int!
    dueDate: Date!
    transactionDate: Date!
    amount: Float!
    categoryId: String!
    categoryName: String
    currencyId: String!
    currencySymbol: String
    transactionCurrencyId: String
    transactionCurrencySymbol: String
    transactionAmount: Float!
    dollarExchangeRate: Float
    currencyDollarExchangeRate: Float
    totalTax: Float
    isInstallment: Boolean!
    currentInstallment: Int!
    installments: Int!
    totalAmount: Float
    parentId: Int
    description: String
    origin: String!
    isValidated: Boolean!
    operationType: String
    createdAt: DateTime!
    editedAt: DateTime
}


# Credit card installments
input GetInstallmentsDueDatesInput {
    creditCardId: String!
    totInstallments: Int!
    transactionDate: Date!
}

type GetInstallmentsDueDatesResponse {
    dueDates: [InstallmentsDueDates]!
}

type InstallmentsDueDates {
    currentInstallment: Int!
    dueDate: Date!
}

# Create credit card transaction
input CreateCreditCardTransactionInput {
    id: Int
    creditCardId: String!
    transactionDate: Date
    totalAmount: Float!
    totalInstallments: Int!
    installments: [BillEntryInstallmentInput!]!
    categoryId: String!
    currencyId: String!
    isInternationalTransaction: Boolean!
    transactionCurrencyId: String
    transactionAmount: Float
    dollarExchangeRate: Float
    currencyDollarExchangeRate: Float
    description: String
}

input BillEntryInstallmentInput {
    transactionId: Int
    currentInstallment: Int!
    dueDate: Date!
    amount: Float!
}

input TaxFeeRequestInput {
    feeType: String!
    feeValue: Float!
    feeCurrencyId: String
}

# Create credit card transaction response
type CreateCreditCardTransactionResponse {
    success: Boolean!
    ids: [Int]
}