extend type Query {
    getAccounts(params: GetAccountsRequest): GetAccountResponse
    getAccountBalance(params: GetAccountBalanceRequest): GetAccountBalanceResponse
}

# Account types
input GetAccountsRequest {
    accountId: String
    currencyId: String
    active: Boolean
}

type GetAccountResponse {
    quantity: Int!
    accounts: [Account]!
}

input GetAccountBalanceRequest {
    accountId: String!
    period: Int!
}

type GetAccountBalanceResponse {
    quantity: Int!
    accountName: String!
    balance: [AccountBalance]!
}

type Account {
    accountId: ID!
    active: Boolean!
    bankId: String!
    nickname: String!
    description: String
    branch: String
    number: String
    openDate: String
    closeDate: String
    typeId: String!
    currencyId: String!
    # credit cards
}

type AccountBalance {
    period: Int!
    previousBalance: Float!
    incoming: Float!
    outgoing: Float!
    transactions: Float!
    earnings: Float!
    balance: Float!
}